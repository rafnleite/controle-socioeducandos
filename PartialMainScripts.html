function filtrarListaSlote(busca){
  var q = String(busca || '').toLowerCase();
  document.querySelectorAll('#tabela-slote tbody tr').forEach(function(tr){
    var sel = tr.querySelector('.slote-status');
    var id = sel ? String(sel.dataset.id || '').toLowerCase() : '';
    var nome = tr.querySelector('td') ? tr.querySelector('td').textContent.toLowerCase() : '';
    tr.style.display = (!q || id.indexOf(q) >= 0 || nome.indexOf(q) >= 0) ? '' : 'none';
  });
}
function definirStatusSlote(status){
  document.querySelectorAll('#tabela-slote tbody tr:not([style*="display: none"]) .slote-status').forEach(function(s){ s.value = status; });
  atualizarContadorSlote();
}
function atualizarContadorSlote(){
  var n = Array.from(document.querySelectorAll('.slote-status')).filter(function(s){ return s.value !== ''; }).length;
  var el = document.getElementById('slote-count');
  if(el) el.textContent = n + ' vinculado' + (n !== 1 ? 's' : '');
}

function verificarConflitosSaidaLoteFormulario(done){
  var ini = obterValorDateTimeFlatpickr(document.getElementById('sl-ida'));
  var fim = obterValorDateTimeFlatpickr(document.getElementById('sl-volta'));
  var box = document.getElementById('slote-conflitos');
  var itens = [];

  document.querySelectorAll('.slote-status').forEach(function(s, idx){
    if(!ini || !s.value) return;
    itens.push({
      linha: idx + 1,
      socioeducando_id: s.dataset.id,
      data_hora_inicio: ini,
      data_hora_termino: fim || ini
    });
  });

  if(!itens.length){
    CONFLITOS_SAIDA_LOTE = null;
    if(box) box.innerHTML = '';
    if(done) done(CONFLITOS_SAIDA_LOTE);
    return;
  }

  consultarConflitosAgenda(itens, {}, function(r){
    CONFLITOS_SAIDA_LOTE = r;
    if(box) box.innerHTML = htmlConflitosAgenda(r);
    if(done) done(CONFLITOS_SAIDA_LOTE);
  });
}

function submitSaidaLote(){
  var vinculos = [];
  document.querySelectorAll('.slote-status').forEach(function(s){
    if(s.value) vinculos.push({ id: s.dataset.id, status: s.value });
  });
  if(!vinculos.length){ document.getElementById('form-msg').innerHTML='<div class="alert alert-danger">Defina o status de ao menos um socioeducando.</div>'; return; }

  var ida = obterValorDateTimeFlatpickr(document.getElementById('sl-ida'));
  var volta = obterValorDateTimeFlatpickr(document.getElementById('sl-volta'));

  var dados = {
    local: document.getElementById('sl-local').value.trim(),
    data_hora_ida: ida,
    data_hora_volta: volta,
    conducao: document.getElementById('sl-cond').value,
    nome_acompanhante: document.getElementById('sl-acomp').value.trim(),
    observacoes_saida: document.getElementById('sl-obs-saida').value.trim()
  };

  if(dados.data_hora_ida && dados.data_hora_volta && dados.data_hora_volta < dados.data_hora_ida){
    document.getElementById('form-msg').innerHTML='<div class="alert alert-danger">A data/hora de volta não pode ser anterior à data/hora de ida.</div>';
    return;
  }

  verificarConflitosSaidaLoteFormulario(function(conflitos){
    if(conflitos && conflitos.conflitos && conflitos.conflitos.length && !modalConfirmarConflitos(conflitos)) return;

    setBusyState(true, 'Salvando para '+vinculos.length+' socioeducando(s)...');
    google.script.run
      .withSuccessHandler(function(r){
        setBusyState(false);
        setContent('<div class="card" style="max-width:480px;margin:0 auto">'
          +'<div class="alert alert-success"><i class="fa-solid fa-circle-check"></i> Saída registrada para <strong>'+r.inseridos+'</strong> socioeducando(s).</div>'
          +'<div class="d-flex gap-2"><button class="btn btn-primary" onclick="mostrarOverview()">Ver Painel</button>'
          +'<button class="btn btn-outline" onclick="mostrarFormSaidaLote()">Nova Saída em Lote</button></div></div>');
      })
      .withFailureHandler(function(err){ setBusyState(false); document.getElementById('form-msg').innerHTML='<div class="alert alert-danger"><i class="fa-solid fa-circle-xmark"></i> '+esc(err.message)+'</div>'; })
      .salvarSaidaLote(vinculos, dados);
  });
}

  setBusyState(true, 'Lendo arquivo...');

function renderPreviewSocioeducandos(linhas){
  linhas = linhas || [];
  var novos = linhas.filter(function(l){ return !l.ja_existe; });
  var existentes = linhas.filter(function(l){ return l.ja_existe; });

  IMPORT_SOCIOEDUCANDOS_PREVIEW = novos.map(function(l){
    return {
      id: l.id,
      nome: l.nome,
      data_admissao: l.data_admissao,
      data_nascimento: l.data_nascimento || '',
      ja_existe: false,
      selecionado: true
    };

function filtrarListaLote(){
  var buscaEl = document.getElementById('lote-busca-nome');
  var q = normalizeBusca(buscaEl ? buscaEl.value : '');
  var filtroEl = document.getElementById('lote-filtro-interesse');
  var interesse = filtroEl ? filtroEl.value : '';
  document.querySelectorAll('#tabela-lote tbody tr').forEach(function(tr){
    var sel = tr.querySelector('.sv-status');
    var id = sel ? String(sel.dataset.id || '').toLowerCase() : '';
    var nome = tr.querySelector('td') ? normalizeBusca(tr.querySelector('td').textContent) : '';
    var interessesTr = String(tr.dataset.interesses || '').split('|');
    var passaTexto = !q || id.indexOf(q) >= 0 || nome.indexOf(q) >= 0;
    var passaInteresse = !interesse || interessesTr.indexOf(interesse) >= 0;
    tr.style.display = (passaTexto && passaInteresse) ? '' : 'none';
  });
}

function definirStatusLote(status){
  document.querySelectorAll('#tabela-lote tbody tr:not([style*="display: none"]) .sv-status').forEach(function(s){
    s.value = status;
    atualizarCorStatusSelect(s);
  });
  atualizarContadorLote();
}

function atualizarContadorLote(){
  var n = document.querySelectorAll('.sv-status').length
    ? Array.from(document.querySelectorAll('.sv-status')).filter(function(s){ return s.value !== ''; }).length
    : 0;
  var el = document.getElementById('lote-count');
  if(el) el.textContent = n + ' vinculado' + (n !== 1 ? 's' : '');
}

function submitCursoLote(){
  var vinculos = [];
  document.querySelectorAll('.sv-status').forEach(function(s){
    if(s.value) vinculos.push({ id: s.dataset.id, matriculado: s.value === 'Matriculado' });
  });

  var ini = document.getElementById('cl-ini').value;
  var ter = document.getElementById('cl-ter').value;
  var hi  = document.getElementById('cl-hi').value;
  var ht  = document.getElementById('cl-ht').value;
  var dias = lerDiasSemanaCurso('cl');
  if((hi && !ht) || (!hi && ht)){ document.getElementById('form-msg').innerHTML='<div class="alert alert-danger"><i class="fa-solid fa-circle-xmark"></i> Informe o horário de início e término juntos, ou deixe ambos em branco.</div>'; return; }
  if(cursoPeriodoInvalidoLocal(ini, hi, ter, ht)){ document.getElementById('form-msg').innerHTML='<div class="alert alert-danger"><i class="fa-solid fa-circle-xmark"></i> O término não pode ser anterior ao início.</div>'; return; }

  var dados = {
    tipo_curso:  document.getElementById('cl-tipo').value,
    nome_curso:  document.getElementById('cl-nome').value.trim().toUpperCase(),
    local:       document.getElementById('cl-local').value,
    instituicao: document.getElementById('cl-inst').value.trim().toUpperCase(),
    vagas: document.getElementById('cl-vagas').value,
    data_limite_inscricao: document.getElementById('cl-limite').value,
    data_inicio: ini, horario_inicio: hi,
    data_termino: ter, horario_termino: ht,
    dias_semana: dias,
    observacoes: document.getElementById('cl-obs').value.trim()
  };

  setBusyState(true, 'Salvando'+(vinculos.length ? ' para '+vinculos.length+' socioeducando(s)' : '')+'...');
  google.script.run
    .withSuccessHandler(function(r){
      setBusyState(false);
      var msgVinculo = r.inseridos ? ' adicionado para <strong>'+r.inseridos+'</strong> socioeducando(s).' : ' cadastrado sem socioeducandos vinculados.';
      setContent('<div class="card" style="max-width:480px;margin:0 auto">'
        +'<div class="alert alert-success"><i class="fa-solid fa-circle-check"></i> Curso <strong>"'+esc(dados.nome_curso)+'"</strong>'+msgVinculo+'</div>'
        +'<div class="d-flex gap-2"><button class="btn btn-primary" onclick="mostrarOverview()">Ver Painel</button>'
        +'<button class="btn btn-outline" onclick="mostrarFormCursoLote()">Novo Lote</button></div></div>');
    })
    .withFailureHandler(function(err){ setBusyState(false); document.getElementById('form-msg').innerHTML='<div class="alert alert-danger"><i class="fa-solid fa-circle-xmark"></i> '+esc(err.message)+'</div>'; })
    .salvarCursoLote(vinculos, dados);
}

    +'<input type="text" placeholder="Buscar nome ou ID..." oninput="filtrarListaInteresseLote(this.value)" style="width:100%;padding:6px 10px;border:1px solid #ced4da;border-radius:5px;font-size:12px">'
    +'</div>'
    +'<div style="margin-bottom:8px;display:flex;gap:4px;flex-wrap:wrap">'
    +'<button class="btn btn-outline btn-xs" onclick="definirSelecaoInteresseLote(true)">Selecionar visíveis</button>'
    +'<button class="btn btn-outline btn-xs" onclick="definirSelecaoInteresseLote(false)">Limpar seleção</button>'
    +'</div>'
    +'<div style="max-height:400px;overflow-y:auto">'
    +'<table id="tabela-interesse-lote"><thead><tr><th>Nome</th></tr></thead><tbody>'+linhasSocioeducandos+'</tbody></table>'
    +'</div></div>'

    +'<div class="card">'
    +'<div class="sec-hdr"><h5>🎯 Interesse</h5></div>'
    +'<div class="form-group"><label>Nome do curso/interesse <span class="req">*</span></label>'
    +'<div class="autocomplete-wrap" id="il-interesse-wrap">'
    +'<input type="text" id="il-interesse" autocomplete="off" placeholder="Ex: Panificação Básica" oninput="onInputInteresseLote(this.value)" onfocus="onFocusInteresseLote()" onkeydown="onKeydownInteresseLote(event)">'
    +'<div class="topo-busca-menu" id="il-interesse-menu">'
    +'<div class="topo-busca-results" id="il-interesse-results"></div>'
    +'</div>'
    +'</div>'
    +'</div>'
    +'<p class="text-muted" style="font-size:12px">O interesse será adicionado a todos os socioeducandos marcados na lista à esquerda. Quem já tiver esse interesse registrado não será duplicado.</p>'
    +'<div class="d-flex gap-2">'
    +'<button class="btn btn-primary" onclick="submitInteressesLote()"><i class="fa-solid fa-floppy-disk"></i> Adicionar interesse aos selecionados</button>'
    +'<button class="btn btn-secondary" onclick="mostrarOverview()">Cancelar</button>'
    +'</div></div>'
    +'</div>';

  setContent(html);
  document.getElementById('tabela-interesse-lote').addEventListener('change', atualizarContadorInteresseLote);
}

function filtrarListaInteresseLote(busca){
  var q = normalizeBusca(busca);
  document.querySelectorAll('#tabela-interesse-lote tbody tr').forEach(function(tr){
    var chk = tr.querySelector('.int-check');
    var id = chk ? String(chk.dataset.id || '').toLowerCase() : '';
    var nome = normalizeBusca(tr.textContent);
    tr.style.display = (!q || id.indexOf(q) >= 0 || nome.indexOf(q) >= 0) ? '' : 'none';
  });
}

function definirSelecaoInteresseLote(marcar){
  document.querySelectorAll('#tabela-interesse-lote tbody tr:not([style*="display: none"]) .int-check').forEach(function(c){ c.checked = marcar; });
  atualizarContadorInteresseLote();
}

function atualizarContadorInteresseLote(){
  var n = Array.from(document.querySelectorAll('.int-check')).filter(function(c){ return c.checked; }).length;
  var el = document.getElementById('int-lote-count');
  if(el) el.textContent = n + ' selecionado' + (n !== 1 ? 's' : '');
}

function abrirMenuInteresseLote(){
  var menu = document.getElementById('il-interesse-menu');
  if(menu) menu.classList.add('open');
}

function fecharMenuInteresseLote(){
  var menu = document.getElementById('il-interesse-menu');
  if(menu) menu.classList.remove('open');
}

function renderInteresseLoteResultados(valor){
  var out = document.getElementById('il-interesse-results');
  if(!out) return;

  var q = normalizeBusca(valor);
  IL_INTERESSE_ITENS = (q
    ? IL_INTERESSE_TODOS.filter(function(i){ return normalizeBusca(i).indexOf(q) >= 0; })
    : IL_INTERESSE_TODOS.slice()
  ).slice(0, 25);

  if(!IL_INTERESSE_ITENS.length){
    IL_INTERESSE_ATIVO_IDX = -1;
    out.innerHTML = '<div class="topo-busca-empty">Nenhum interesse cadastrado ainda.</div>';
    return;
  }

  if(IL_INTERESSE_ATIVO_IDX < 0 || IL_INTERESSE_ATIVO_IDX >= IL_INTERESSE_ITENS.length) IL_INTERESSE_ATIVO_IDX = -1;

  out.innerHTML = IL_INTERESSE_ITENS.map(function(i, idx){
    return '<button type="button" class="topo-busca-item'+(idx === IL_INTERESSE_ATIVO_IDX ? ' active' : '')+'" onclick="selecionarInteresseLote(\''+esc(i).replace(/'/g,"\\'")+'\')">'
      +'<span class="nome">'+esc(i)+'</span>'
      +'</button>';
  }).join('');
}

function atualizarItemAtivoInteresseLote(){
  var out = document.getElementById('il-interesse-results');
  if(!out) return;
  var itens = out.querySelectorAll('.topo-busca-item');
  itens.forEach(function(el, idx){
    if(idx === IL_INTERESSE_ATIVO_IDX) el.classList.add('active');
    else el.classList.remove('active');
  });
  if(IL_INTERESSE_ATIVO_IDX >= 0 && itens[IL_INTERESSE_ATIVO_IDX]) itens[IL_INTERESSE_ATIVO_IDX].scrollIntoView({ block:'nearest' });
}

function moverAtivoInteresseLote(delta){
  if(!IL_INTERESSE_ITENS.length) return;
  if(IL_INTERESSE_ATIVO_IDX < 0){
    IL_INTERESSE_ATIVO_IDX = delta > 0 ? 0 : IL_INTERESSE_ITENS.length - 1;
  } else {
    IL_INTERESSE_ATIVO_IDX = (IL_INTERESSE_ATIVO_IDX + delta + IL_INTERESSE_ITENS.length) % IL_INTERESSE_ITENS.length;
  }
  atualizarItemAtivoInteresseLote();
}

function selecionarInteresseLote(valor){
  var inp = document.getElementById('il-interesse');
  if(inp) inp.value = valor;
  IL_INTERESSE_ITENS = [];
  IL_INTERESSE_ATIVO_IDX = -1;
  fecharMenuInteresseLote();
}

function onInputInteresseLote(valor){
  abrirMenuInteresseLote();
  renderInteresseLoteResultados(valor);
}

function onFocusInteresseLote(){
  var inp = document.getElementById('il-interesse');
  abrirMenuInteresseLote();
  renderInteresseLoteResultados(inp ? inp.value : '');
}

function onKeydownInteresseLote(e){
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    abrirMenuInteresseLote();
    if(!IL_INTERESSE_ITENS.length) renderInteresseLoteResultados(document.getElementById('il-interesse').value || '');
    moverAtivoInteresseLote(1);
  } else if(e.key === 'ArrowUp'){
    e.preventDefault();
    abrirMenuInteresseLote();
    if(!IL_INTERESSE_ITENS.length) renderInteresseLoteResultados(document.getElementById('il-interesse').value || '');
    moverAtivoInteresseLote(-1);
  } else if(e.key === 'Enter'){
    if(IL_INTERESSE_ATIVO_IDX >= 0 && IL_INTERESSE_ITENS[IL_INTERESSE_ATIVO_IDX]){
      e.preventDefault();
      selecionarInteresseLote(IL_INTERESSE_ITENS[IL_INTERESSE_ATIVO_IDX]);
    } else {
      fecharMenuInteresseLote();
    }
  } else if(e.key === 'Escape'){
    e.preventDefault();
    fecharMenuInteresseLote();
  }
}

function submitInteressesLote(){
  var interesse = document.getElementById('il-interesse').value.trim();
  if(!interesse){ document.getElementById('form-msg').innerHTML='<div class="alert alert-danger">Informe o nome do interesse.</div>'; return; }
  var ids = Array.from(document.querySelectorAll('.int-check')).filter(function(c){ return c.checked; }).map(function(c){ return c.dataset.id; });
  if(!ids.length){ document.getElementById('form-msg').innerHTML='<div class="alert alert-danger">Selecione ao menos um socioeducando.</div>'; return; }

  setBusyState(true, 'Salvando interesses...');
  google.script.run
    .withSuccessHandler(function(r){
      setBusyState(false);
      setContent('<div class="card" style="max-width:480px;margin:0 auto">'
        +'<div class="alert alert-success"><i class="fa-solid fa-circle-check"></i> Interesse <strong>"'+esc(interesse)+'"</strong> adicionado para <strong>'+r.inseridos+'</strong> socioeducando(s)'+(r.ignorados ? ' ('+r.ignorados+' já possuíam este interesse)' : '')+'.</div>'
        +'<div class="d-flex gap-2"><button class="btn btn-primary" onclick="mostrarOverview()">Ver Painel</button>'
        +'<button class="btn btn-outline" onclick="mostrarFormInteressesLote()">Novo Lote</button></div></div>');
    })
    .withFailureHandler(function(err){ setBusyState(false); document.getElementById('form-msg').innerHTML='<div class="alert alert-danger"><i class="fa-solid fa-circle-xmark"></i> '+esc(err.message)+'</div>'; })
    .salvarInteressesLote(ids, interesse);
}

function mostrarConfigTiposAtendimento(){
  navActive('btn-nav-config');
  ESTADO.tela = 'config-tipos-atendimento';
  showSpinner('Carregando tipos de atendimento...');
  google.script.run
    .withSuccessHandler(function(lista){ renderConfigTiposAtendimento(lista || []); })
    .withFailureHandler(showError)
    .getTiposAtendimentoConfig();
}

function renderConfigTiposAtendimento(lista, tipoEditando){
  ULTIMA_LISTA_TIPOS_ATENDIMENTO = lista || [];
  var editando = tipoEditando ? ULTIMA_LISTA_TIPOS_ATENDIMENTO.find(function(t){ return t.tipo === tipoEditando; }) : null;

  var linhas = ULTIMA_LISTA_TIPOS_ATENDIMENTO.length === 0
    ? '<tr><td colspan="4" class="no-records">Nenhum tipo de atendimento cadastrado.</td></tr>'
    : ULTIMA_LISTA_TIPOS_ATENDIMENTO.map(function(t){
        var usoBadge = t.em_uso > 0
          ? '<span class="badge b-blue" title="Quantidade de atendimentos já registrados com este tipo">'+t.em_uso+' em uso</span>'
          : '<span class="text-muted">—</span>';
        return '<tr>'
          +'<td>'+esc(t.tipo)+'</td>'
          +'<td>'+esc(t.duracao_minutos)+' min</td>'
          +'<td>'+usoBadge+'</td>'
          +'<td style="white-space:nowrap">'
          +'<button class="btn btn-outline btn-xs" onclick="renderConfigTiposAtendimento(ULTIMA_LISTA_TIPOS_ATENDIMENTO, \''+esc(t.tipo)+'\')"><i class="fa-solid fa-pen-to-square"></i> Editar</button> '
          +'<button class="btn btn-outline btn-xs" style="color:#dc3545;border-color:#dc3545" onclick="excluirTipoAtendimentoUI(\''+esc(t.tipo)+'\')"><i class="fa-solid fa-trash"></i> Excluir</button>'
          +'</td>'
          +'</tr>';
      }).join('');

  var html = ''
    +'<div class="card" style="max-width:720px;margin:0 auto">'
    +'<div class="page-hdr"><h4><i class="fa-solid fa-gear"></i> Configurações — Tipos de Atendimento</h4></div>'
    +'<div id="form-msg"></div>'
    +'<p class="text-muted" style="font-size:12px">Cadastre, edite ou exclua os tipos de atendimento disponíveis nos formulários de atendimento, e defina a duração padrão (em minutos) usada para calcular automaticamente o horário de término.</p>'
    +'<div style="overflow-x:auto"><table><thead><tr><th>Tipo</th><th>Duração padrão</th><th>Uso</th><th></th></tr></thead><tbody>'+linhas+'</tbody></table></div>'
    +'<div class="sec-hdr" style="margin-top:16px"><h5>'+(editando ? '<i class="fa-solid fa-pen-to-square"></i> Editar tipo' : '+ Novo tipo')+'</h5></div>'
    +'<input type="hidden" id="cfg-tipo-original" value="'+(editando ? esc(editando.tipo) : '')+'">'
    +'<div class="row2">'
    +'<div class="form-group"><label>Nome do tipo <span class="req">*</span></label><input type="text" id="cfg-tipo-nome" value="'+(editando ? esc(editando.tipo) : '')+'" placeholder="Ex: Psicológico"></div>'
    +'<div class="form-group"><label>Duração padrão (minutos) <span class="req">*</span></label><input type="number" id="cfg-tipo-duracao" min="1" step="1" value="'+(editando ? esc(editando.duracao_minutos) : 60)+'"></div>'
    +'</div>'
    +'<div class="d-flex gap-2">'
    +'<button class="btn btn-primary" onclick="submitTipoAtendimento()"><i class="fa-solid fa-floppy-disk"></i> '+(editando ? 'Salvar alterações' : 'Adicionar tipo')+'</button>'
    +(editando ? '<button class="btn btn-secondary" onclick="renderConfigTiposAtendimento(ULTIMA_LISTA_TIPOS_ATENDIMENTO)">Cancelar edição</button>' : '')
    +'</div>'
    +'</div>';
  setContent(html);
}

function submitTipoAtendimento(){
  var dados = {
    tipo_original: document.getElementById('cfg-tipo-original').value,
    tipo: document.getElementById('cfg-tipo-nome').value.trim(),
    duracao_minutos: Number(document.getElementById('cfg-tipo-duracao').value)
  };
  if(!dados.tipo){
    document.getElementById('form-msg').innerHTML='<div class="alert alert-danger">Informe o nome do tipo.</div>';
    return;
  }
  if(!dados.duracao_minutos || dados.duracao_minutos <= 0){
    document.getElementById('form-msg').innerHTML='<div class="alert alert-danger">Informe uma duração padrão válida (em minutos).</div>';
    return;
  }

  setBusyState(true, 'Salvando tipo de atendimento...');
  google.script.run
    .withSuccessHandler(function(){ setBusyState(false); mostrarConfigTiposAtendimento(); })
    .withFailureHandler(function(err){ setBusyState(false); document.getElementById('form-msg').innerHTML='<div class="alert alert-danger"><i class="fa-solid fa-circle-xmark"></i> '+esc(err.message)+'</div>'; })
    .salvarTipoAtendimento(dados);
}

function excluirTipoAtendimentoUI(tipo, forcar){
  if(!forcar && !confirm('Excluir o tipo de atendimento "'+tipo+'"?')) return;
  setBusyState(true, 'Excluindo tipo de atendimento...');
  google.script.run
    .withSuccessHandler(function(){ setBusyState(false); mostrarConfigTiposAtendimento(); })
    .withFailureHandler(function(err){
      setBusyState(false);
      var msg = err && err.message ? err.message : '';
      if(msg.indexOf('Deseja excluir mesmo assim?') >= 0){
        if(confirm(msg)) excluirTipoAtendimentoUI(tipo, true);
      } else {
        document.getElementById('form-msg').innerHTML='<div class="alert alert-danger"><i class="fa-solid fa-circle-xmark"></i> '+esc(msg)+'</div>';
      }
    })
    .excluirTipoAtendimento(tipo, !!forcar);
}

  if(page === 'perfil' && id){

    navActive('btn-nav-cad');

    navActive('btn-nav-cad');

  } else if(page === 'curso'){

    mostrarFormCursoLote();
  } else if(page === 'importar'){
    navActive('btn-nav-imp');
    mostrarMenuImportar();
